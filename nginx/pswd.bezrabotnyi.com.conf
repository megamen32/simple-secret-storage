# pswd.bezrabotnyi.com — Simple Secret Storage (MCP)
#
# Pattern follows auth.bezrabotnyi.com (127.0.0.1:8444 ssl, SNI-based,
# per-site cert under /etc/letsencrypt/live/<host>/).
#
# /d/<token> one-time decrypt URLs are logged with access_log off
# so plaintext (base64) doesn't end up in nginx access logs.
# Everything else uses the sss-access log.

server {
    server_name pswd.bezrabotnyi.com;

    client_max_body_size 1m;

    # Long-poll friendly (MCP Streamable HTTP may hold connections open)
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    location = / {
        proxy_pass http://127.0.0.1:8743;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Anonymous input form — token is the credential, no Bearer needed.
    # /i/<token> serves the form, /submit/<token> accepts POST value.
    location ~ ^/i/[A-Za-z0-9_-]+$ {
        proxy_pass http://127.0.0.1:8743;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        access_log off;  # URL contains the one-time token
    }

    location ~ ^/submit/[A-Za-z0-9_-]+$ {
        proxy_pass http://127.0.0.1:8743;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        access_log off;  # URL contains the one-time token
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8743;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        access_log /var/log/nginx/sss-access.log;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8743;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        access_log /var/log/nginx/sss-mcp.log;
    }

    # One-time decrypt — token itself is the credential. Don't log URL.
    location ~ ^/d/[A-Fa-f0-9]+$ {
        proxy_pass http://127.0.0.1:8743;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        access_log off;
    }

    listen 127.0.0.1:8444 ssl;
    ssl_certificate /etc/letsencrypt/live/pswd.bezrabotnyi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pswd.bezrabotnyi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS redirect
server {
    if ($host = pswd.bezrabotnyi.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name pswd.bezrabotnyi.com;
    return 404;
}